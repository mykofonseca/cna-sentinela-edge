; Nó Sentinela - Centro Nuclear Atlântico (CNA)
; Mesmo firmware para as duas zonas; a zona sai do build_flags de cada env.

[platformio]
default_envs = z1

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
; Janela de horário permitido (hora local, UTC-3). Fora dela PIR e portão pesam mais.
build_flags =
    -DHORA_INICIO=7
    -DHORA_FIM=19

[env:z1]
build_flags =
    ${env.build_flags}
    -DZONA_ID=1

[env:z2]
build_flags =
    ${env.build_flags}
    -DZONA_ID=2
